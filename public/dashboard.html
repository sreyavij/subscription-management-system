<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Brightloop Dashboard</title>
<style>
body{font-family:sans-serif;margin:20px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.card{border:1px solid #ccc;border-radius:8px;padding:12px 18px;min-width:150px}
.card b{font-size:22px;display:block}
table{border-collapse:collapse;width:100%;margin:8px 0}
td,th{border:1px solid #ddd;padding:6px;text-align:left}
nav button{margin-right:6px}
</style></head>
<body>
<h2>Brightloop Dashboard <button onclick="logout()">Logout</button></h2>
<nav>
<button onclick="location.href='/admin.html'">Admin setup</button>
  <button onclick="summary()">Summary</button>
  <button onclick="subs()">Subscriptions</button>
  <button onclick="invs()">Invoices</button>
  <button onclick="runBilling()">Run billing now</button>
</nav>
<p id="msg" style="color:green"></p>
<div id="view"></div>
<script>
const T = localStorage.getItem('token');
if (!T) location.href = '/';
const api = (u, m = 'GET', b) => fetch('/api/' + u, {
  method: m,
  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + T },
  body: b ? JSON.stringify(b) : undefined
}).then(r => r.json()).then(d => {
  if (d.error === 'Login required') logout();
  return d;
});
const logout = () => { localStorage.clear(); location.href = '/'; };
const $ = id => document.getElementById(id);

function table(rows, cols, action) {
  if (!rows.length) return '<p>No records.</p>';
  return '<table><tr>' + cols.map(c => `<th>${c}</th>`).join('') + (action ? '<th>Action</th>' : '') + '</tr>' +
    rows.map(r => '<tr>' + cols.map(c => `<td>${r[c] ?? ''}</td>`).join('') + (action ? `<td>${action(r)}</td>` : '') + '</tr>').join('') +
    '</table>';
}

async function summary() {
  const s = await api('reports/summary');
  $('view').innerHTML = `<div class="cards">
    <div class="card">Active subscriptions<b>${s.active_subscriptions}</b></div>
    <div class="card">Revenue received<b>${s.revenue}</b></div>
    <div class="card">Outstanding<b>${s.outstanding}</b></div>
    <div class="card">Overdue invoices<b>${s.overdue.length}</b></div></div>
    <h3>Overdue invoices</h3>` +
    table(s.overdue, ['number', 'customer_id', 'total', 'amount_paid', 'due_date']);
}

async function subs() {
  const rows = await api('subscriptions');
  $('view').innerHTML = '<h3>Subscriptions</h3>' +
    table(rows, ['id', 'number', 'customer_id', 'plan_id', 'status', 'next_billing', 'paused'],
      r => (r.status !== 'Closed' ? `<button onclick="advance(${r.id})">Next status</button> ` : '') +
           (r.status === 'Active' ? `<button onclick="pause(${r.id})">Pause/Resume</button>` : ''));
}
async function advance(id) { const d = await api(`subscriptions/${id}/advance`, 'POST'); $('msg').textContent = d.error || 'Now ' + d.status; subs(); }
async function pause(id) { await api(`subscriptions/${id}/pause`, 'POST'); subs(); }

async function invs() {
  const rows = await api('invoices');
  $('view').innerHTML = '<h3>Invoices</h3>' +
    table(rows, ['id', 'number', 'customer_id', 'subtotal', 'discount_total', 'tax_total', 'total', 'amount_paid', 'status', 'due_date'],
      r => r.status === 'Draft' ? `<button onclick="confirmInv(${r.id})">Confirm</button> <button onclick="cancelInv(${r.id})">Cancel</button>`
         : r.status === 'Confirmed' ? `<button onclick="pay(${r.id})">Record payment</button> <button onclick="cancelInv(${r.id})">Cancel</button>` : '');
}
async function confirmInv(id) { const d = await api(`invoices/${id}/confirm`, 'POST'); $('msg').textContent = d.error || 'Confirmed'; invs(); }
async function cancelInv(id) { const d = await api(`invoices/${id}/cancel`, 'POST'); $('msg').textContent = d.error || 'Cancelled'; invs(); }
async function pay(id) {
  const amount = +prompt('Amount?'); if (!amount) return;
  const method = prompt('Method (UPI / Card / Cash / Bank)?', 'UPI');
  const note = prompt('Note?', '');
  const d = await api('payments', 'POST', { invoice_id: id, method, amount, note, date: new Date().toISOString().slice(0, 10) });
  $('msg').textContent = d.error || 'Payment recorded'; invs();
}
async function runBilling() {
  const d = await api('billing/run', 'POST', {});
  $('msg').textContent = d.invoices_created + ' new invoice(s) created'; invs();
}
summary();
</script></body></html>
