<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password - Brightloop</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="auth">
  <h1><svg width="28" height="28" viewBox="0 0 28 28"><path d="M22 14a8 8 0 1 1-3-6.2" fill="none" stroke="#00D4C4" stroke-width="3" stroke-linecap="round"/></svg>Forgot password</h1>
  <p>Enter your registered email and we will send you a reset link.</p>
  <input id="email" type="email" placeholder="Email">
  <button class="primary" style="width:100%;padding:11px" onclick="send()">Send reset link</button>
  <p id="msg" style="margin-top:14px;font-weight:600"></p>
  <p><a href="/">Back to login</a></p>
</div>
<script>
async function send() {
  const m = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();
  if (!email) { m.style.color = 'var(--bad)'; return m.textContent = 'Enter your email address'; }
  await fetch('/api/forgot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
  m.style.color = 'var(--teal-deep)';
  m.textContent = 'If that email is registered, a reset link has been sent. It expires in 1 hour.';
}
</script></body></html>
