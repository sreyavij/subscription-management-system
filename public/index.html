<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brightloop</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="auth">
  <h1><svg width="28" height="28" viewBox="0 0 28 28"><path d="M22 14a8 8 0 1 1-3-6.2" fill="none" stroke="#2F4BFF" stroke-width="3" stroke-linecap="round"/></svg>Brightloop</h1>
  <p>Sign in to manage subscriptions and invoices.</p>
  <input id="email" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password">
  <input id="name" placeholder="Your name (new accounts only)">
  <div class="row"><button class="primary" onclick="login()">Log in</button><button onclick="signup()">Create account</button></div>
  <p id="msg" class="err"></p>
</div>
<script>
const body = () => JSON.stringify({ name: name.value, email: email.value, password: pw.value });
const post = u => fetch(u, { method:'POST', headers:{'Content-Type':'application/json'}, body: body() }).then(r => r.json());
async function signup(){ const d = await post('/api/signup'); msg.style.color = d.error ? '' : 'var(--ok)'; msg.textContent = d.error || 'Account created. You can log in now.'; }
async function login(){
  const d = await post('/api/login');
  if (d.error) { msg.style.color = ''; return msg.textContent = d.error; }
  localStorage.setItem('token', d.token); localStorage.setItem('role', d.role);
  location.href = d.role === 'customer' ? '/portal.html' : '/office.html';
}
</script></body></html>
